x-app: &app
  build:
    context: .
    dockerfile: ./compose/local/django/Dockerfile
  image: {{ cookiecutter.project_slug }}_django:prod
  volumes:
    - .:/app:z
  env_file:
    - ./.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_READ_DOT_ENV_FILE: "true"
  restart: unless-stopped

services:
  django:
    <<: *app
    container_name: {{ cookiecutter.project_slug }}_django_prod
    {%- if cookiecutter.database_engine == 'postgres' %}
    depends_on:
      postgres:
        condition: service_healthy
    {%- if cookiecutter.use_redis == "yes" %}
      redis:
        condition: service_healthy
    {%- endif %}
    {%- elif cookiecutter.database_engine == 'mysql' %}
    depends_on:
      mysql:
        condition: service_healthy
    {%- if cookiecutter.use_redis == "yes" %}
      redis:
        condition: service_healthy
    {%- endif %}
    {%- endif %}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: /start

  {%- if cookiecutter.database_engine == 'postgres' %}
  postgres:
    image: docker.io/postgres:15
    container_name: {{ cookiecutter.project_slug }}_postgres_prod
    environment:
      POSTGRES_DB: {{ cookiecutter.project_slug }}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  {%- elif cookiecutter.database_engine == 'mysql' %}
  mysql:
    image: docker.io/mysql:8.4
    container_name: {{ cookiecutter.project_slug }}_mysql_prod
    environment:
      MYSQL_DATABASE: {{ cookiecutter.project_slug }}
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_TCP_PORT: 3306
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -ppassword --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
  {%- endif %}

  {%- if cookiecutter.use_redis == "yes" %}
  redis:
    image: docker.io/redis:7-alpine
    container_name: {{ cookiecutter.project_slug }}_redis_prod
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  {%- endif %}

  {%- if cookiecutter.use_celery == "yes" %}
  celeryworker:
    <<: *app
    container_name: {{ cookiecutter.project_slug }}_celeryworker_prod
    {%- if cookiecutter.use_redis == "yes" %}
    depends_on:
      redis:
        condition: service_healthy
    {%- endif %}
    command: /start-celeryworker

  celerybeat:
    <<: *app
    container_name: {{ cookiecutter.project_slug }}_celerybeat_prod
    {%- if cookiecutter.use_redis == "yes" %}
    depends_on:
      redis:
        condition: service_healthy
    {%- endif %}
    command: /start-celerybeat

  flower:
    <<: *app
    container_name: {{ cookiecutter.project_slug }}_flower_prod
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    {%- if cookiecutter.use_redis == "yes" %}
    depends_on:
      redis:
        condition: service_healthy
    {%- endif %}
    command: /start-flower
  {%- endif %}
