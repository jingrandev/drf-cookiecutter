version: '3'

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: {{ cookiecutter.project_slug }}_django
    container_name: {{ cookiecutter.project_slug }}_django
    volumes:
      - .:/app:z
    env_file:
      - ./.env
    {%- if cookiecutter.database_engine == 'postgres' %}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/{{ cookiecutter.project_slug }}
    {%- elif cookiecutter.database_engine == 'mysql' %}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/{{ cookiecutter.project_slug }}?charset=utf8mb4
    {%- endif %}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    command: /start

  {%- if cookiecutter.database_engine == 'postgres' %}
  postgres:
    image: docker.io/postgres:15
    container_name: {{ cookiecutter.project_slug }}_postgres
    environment:
      POSTGRES_DB: {{ cookiecutter.project_slug }}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  {%- elif cookiecutter.database_engine == 'mysql' %}
  mysql:
    image: docker.io/mysql:8.4
    container_name: {{ cookiecutter.project_slug }}_mysql
    environment:
      MYSQL_DATABASE: {{ cookiecutter.project_slug }}
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_TCP_PORT: 3306
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
  {%- endif %}
